<ng-container *transloco="let t">
  <app-format-editor
    #editor
    [stages]="views()"
    [ranked]="preview()?.ranked ?? 0"
    [ties]="preview()?.ties ?? false"
    [entrants]="entrants()"
    [readonly]="readonly()"
    (changed)="stages.set($event)"
    (added)="add($event, editor)"
    (removed)="remove($event, editor)"
  >
    <div class="toolbar">
      <a class="btn btn-sm back" routerLink="/presets">← {{ t('presets.title') }}</a>
      <div class="fields">
        <input class="input name" maxlength="60" [disabled]="readonly()" [attr.aria-label]="t('presets.name')" [placeholder]="t('presets.name')" [value]="name()" (input)="name.set(value($event))" />
        <input class="input" maxlength="200" [disabled]="readonly()" [attr.aria-label]="t('presets.description')" [placeholder]="t('presets.description')" [value]="description()" (input)="description.set(value($event))" />
      </div>
      <div class="simulate">
        <span class="simulate-label">{{ t('presets.simulateWith') }}</span>
        <div class="stepper">
          <button type="button" (click)="stepEntrants(-1)">−</button>
          <input class="stepper-input" type="number" min="0" max="512" [attr.aria-label]="t('presets.simulateWith') + ' (' + t('presets.teams') + ')'" [value]="entrants()" (input)="setEntrants($event)" />
          <button type="button" (click)="stepEntrants(1)">+</button>
        </div>
        <span class="simulate-label">{{ t('presets.teams') }}</span>
      </div>
      <div class="actions">
        @if (readonly()) {
          <span class="pill pill-muted">{{ t('presets.readOnly') }}</span>
          <button type="button" class="btn btn-sm btn-primary" (click)="duplicate()">{{ t('presets.duplicateToEdit') }}</button>
        } @else {
          <button type="button" class="btn btn-sm" [disabled]="!canAdd()" [attr.title]="canAdd() ? null : t('format.addNeedsPools')" (click)="add(stageKinds.StagePools, editor)">+ {{ t('format.addPools') }}</button>
          <button type="button" class="btn btn-sm" [disabled]="!canAdd()" [attr.title]="canAdd() ? null : t('format.addNeedsPools')" (click)="add(stageKinds.StageBracket, editor)">+ {{ t('format.addBracket') }}</button>
          <button type="button" class="btn btn-sm btn-primary" [disabled]="!name().trim()" (click)="save()">{{ t('presets.save') }}</button>
        }
      </div>
      @if (error(); as e) {
        <div class="error" role="alert">{{ t('errors.' + e.code) }}</div>
      }
      @if (presets.error(); as e) {
        <div class="error" role="alert">{{ t('errors.' + e.code) }}</div>
      }
    </div>
  </app-format-editor>
</ng-container>
