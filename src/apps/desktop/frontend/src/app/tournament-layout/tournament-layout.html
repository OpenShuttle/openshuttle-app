<ng-container *transloco="let t">
  <nav class="nav">
    @for (group of groups; track group.key) {
      <div class="group">
        <span class="field-label">{{ t('nav.' + group.key) }}</span>
        @for (item of group.items; track item.key) {
          @if (item.path) {
            <a class="item" [routerLink]="item.path" routerLinkActive="active">{{ t('nav.' + item.key) }}</a>
          } @else {
            <span class="item disabled" [attr.title]="t('nav.soon')">{{ t('nav.' + item.key) }}</span>
          }
        }
      </div>
    }
  </nav>
  <section class="page">
    <router-outlet />
  </section>
</ng-container>
