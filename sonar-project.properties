# SonarQube Cloud analysis, run by the Sonar job of .github/workflows/ci.yml.
sonar.projectKey=OpenShuttle_openshuttle-app
sonar.organization=openshuttle
sonar.projectName=OpenShuttle
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*_test.go,**/*.spec.ts,src/apps/desktop/frontend/src/testing/**
# Generated or third-party code, build output, and the tests themselves.
sonar.exclusions=**/node_modules/**,**/dist/**,**/.angular/**,**/coverage/**,\
  src/apps/desktop/frontend/bindings/**,src/apps/desktop/build/**,src/apps/desktop/bin/**,\
  **/*_test.go,**/*.spec.ts,src/apps/desktop/frontend/src/testing/**
sonar.cpd.exclusions=**/*_test.go,**/*.spec.ts,src/apps/desktop/frontend/src/testing/**

# Coverage, produced by the Go and Frontend jobs.
sonar.go.coverage.reportPaths=src/coverage.out
sonar.go.tests.reportPaths=src/go-test.json
sonar.javascript.lcov.reportPaths=src/apps/desktop/frontend/coverage/openshuttle/lcov.info
