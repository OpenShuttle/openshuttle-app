name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/apps/desktop/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/apps/desktop/frontend/package-lock.json
      - run: npm ci
      - name: Check i18n keys
        run: npm run i18n:check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: src/apps/desktop/frontend/dist
          retention-days: 1

  go:
    name: Go
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: Install GTK and WebKit
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev
      # The desktop package embeds the built frontend.
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: src/apps/desktop/frontend/dist
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt -w on: $unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...

  signoff:
    name: Sign-off (DCO)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Every commit of the pull request carries "Signed-off-by" from its
      # author: see CONTRIBUTING.md.
      - name: Check sign-offs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git log -1 --format='%an <%ae>' "$c")
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -qF "$author"; then
              echo "::error::$(git log -1 --format='%h %s' "$c") is not signed off by $author (git commit -s)"
              missing=1
            fi
          done
          exit $missing
